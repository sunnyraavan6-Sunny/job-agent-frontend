server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real file falls back to
    # index.html so React Router can handle client-side routes like /jobs.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets; index.html itself is
    # excluded above so new deploys are picked up immediately.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
